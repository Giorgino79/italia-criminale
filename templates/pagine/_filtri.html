<section id="ricerca" class="ricerca">
  <h2>{{ titolo|default:"Ricerca" }}</h2>
  <form class="filtri" method="get">
    {% for campo in filtro.form %}
      <label>{{ campo.label }}{{ campo }}</label>
    {% endfor %}
    <div class="filtri__azioni">
      <button type="submit">Cerca</button>
      <a href="?">Azzera</a>
    </div>
  </form>
</section>
